name: Windows build (paired release preparation)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer for the Windows installer
        required: true
        default: 6.25.5
      verify_published_update:
        description: Test the published update only; do not rebuild or publish
        type: boolean
        default: false
      publish_windows_hotfix:
        description: Publish the owner-approved Windows-only 6.25.3 hotfix after checks
        type: boolean
        default: false
      publish_prepared_pair:
        description: Publish the owner-approved prepared 6.25.5 pair with disclosed Mac-only MCP and provider limitations
        type: boolean
        default: false
  push:
    tags:
      - windows-v*

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.verify_published_update != true && inputs.publish_prepared_pair != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (!$version) { $version = $env:SOURCE_REF -replace '^windows-v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid stable version' }
          "DROPDRIVE_WINDOWS_VERSION=$version" >> $env:GITHUB_ENV
          $sourceHash = git rev-parse HEAD:packaging/parity-contract.json
          $workingHash = git hash-object --no-filters packaging/parity-contract.json
          if ($LASTEXITCODE -ne 0 -or $sourceHash -ne $workingHash) {
            throw 'Shared release contract bytes changed during checkout.'
          }
          Write-Host "Shared contract SHA256: $((Get-FileHash packaging/parity-contract.json -Algorithm SHA256).Hash.ToLowerInvariant())"
      - name: Fetch Windows media tools
        shell: pwsh
        run: ./windows/fetch-tools.ps1
      - name: Configure Windows desktop OAuth client
        shell: pwsh
        env:
          GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
        run: |
          if ($env:GOOGLE_DESKTOP_OAUTH_JSON) {
            $config = $env:GOOGLE_DESKTOP_OAUTH_JSON | ConvertFrom-Json
            if (!$config.installed.client_id -or !$config.installed.client_secret) { throw "Expected an installed/Desktop OAuth client." }
            [IO.File]::WriteAllText((Join-Path $PWD 'windows/DropDrive.Windows/oauth-client.json'), $env:GOOGLE_DESKTOP_OAUTH_JSON)
          } else {
            throw "Paired artifact blocked: configure GOOGLE_DESKTOP_OAUTH_JSON for optional Google login."
          }
      - name: Run Windows core checks
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -p:TreatWarningsAsErrors=true
      - name: Upload Windows UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Windows-UI-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/ui-checks/*.png
          if-no-files-found: error
      - name: Check native Windows notifications and integration
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -- --windows-shell
      - name: Probe public media providers without accounts
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -- --live-providers
      - name: Save live provider results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Provider-Checks-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/provider-checks.txt
      - name: Build EXE and installer
        shell: pwsh
        run: ./windows/build-windows.ps1 -Version $env:DROPDRIVE_WINDOWS_VERSION
      - name: Smoke-test installed app payload
        shell: pwsh
        run: |
          $process = Start-Process ./windows/artifacts/publish/DropDrive.exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "DropDrive exited during startup." }
            $process.Refresh()
            if ($process.MainWindowTitle -ne "DropDrive") {
              throw "DropDrive did not create its main window."
            }
            if (!(Test-Path ./windows/artifacts/releases/releases.win.json)) {
              throw "Windows update feed is missing."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Test installed upgrade and state retention
        shell: pwsh
        run: ./windows/test-install.ps1
      - name: Record tested artifact identity for paired release
        shell: pwsh
        run: |
          $files = @(Get-ChildItem windows/artifacts/releases -File | ForEach-Object {
            @{ name = $_.Name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          @{ schema = 1; platform = 'windows'; version = $env:DROPDRIVE_WINDOWS_VERSION;
             commit = '${{ github.sha }}'; contract_sha256 = (Get-FileHash packaging/parity-contract.json -Algorithm SHA256).Hash.ToLowerInvariant();
             checks = @('core-ui', 'native-shell', 'packaged-startup', 'installed-upgrade'); files = $files
          } | ConvertTo-Json -Depth 6 | Set-Content windows/artifacts/releases/windows-build.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Windows-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/releases/*
      # The build job cannot publish. The explicit hotfix job below is Windows-only.
  verify-published-update:
    if: ${{ inputs.verify_published_update == true }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: ["0.6.0", "6.25.1", "6.25.2", "6.25.3", "6.25.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Verify real public feed upgrade and retained state
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          SOURCE_VERSION: ${{ matrix.source }}
        run: |
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          ./windows/test-auto-update.ps1 -ExpectedVersion $env:EXPECTED_VERSION -SourceVersion $env:SOURCE_VERSION
  publish-prepared-pair:
    if: ${{ inputs.publish_prepared_pair == true && inputs.verify_published_update != true && inputs.version == '6.25.5' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DropDrive-Windows-6.25.5
          path: prepared
          run-id: 39744559124
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: DropDrive-Provider-Checks-6.25.5
          path: provider
          run-id: 39744559124
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v7
        with:
          script: |
            // Scoped maintenance release requested by the owner, not a full live
            // parity certification. Keep provider failures in the public notes.
            const fs = require('fs'), crypto = require('crypto'), path = require('path');
            const owner = context.repo.owner, repo = context.repo.repo;
            const commit = 'a3c6b2c18bc45c7295eb91b3007493ee9a241304';
            const version = '6.25.5', tag = 'v'+version;
            const check = (ok, why) => { if (!ok) throw new Error(why); };
            const hash = data => crypto.createHash('sha256').update(data).digest('hex');
            const sourceRun = (await github.rest.actions.getWorkflowRun({owner,repo,run_id:39744559124})).data;
            check(sourceRun.head_sha === commit && sourceRun.conclusion === 'success' && sourceRun.path === '.github/workflows/windows.yml', 'Source build mismatch');
            const contractHash = hash(fs.readFileSync('packaging/parity-contract.json'));
            const releases = await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            const release = releases.find(r => r.tag_name === tag);
            check(release && release.draft && !release.prerelease && release.target_commitish === commit, 'Expected pinned unpublished draft');
            let assets = await github.paginate(github.rest.repos.listReleaseAssets,{owner,repo,release_id:release.id,per_page:100});
            const macReceiptAsset = assets.find(a => a.name === 'mac-build.json');
            check(macReceiptAsset, 'Missing Mac build receipt');
            const macReceiptResponse = await github.rest.repos.getReleaseAsset({owner,repo,asset_id:macReceiptAsset.id,headers:{accept:'application/octet-stream'}});
            const mac = JSON.parse(Buffer.from(macReceiptResponse.data).toString('utf8'));
            const win = JSON.parse(fs.readFileSync('prepared/windows-build.json','utf8'));
            for (const [r,platform,checks] of [[mac,'mac',['regressions','performance','keychain','offline-engine','media-fixtures','signed-build']], [win,'windows',['core-ui','native-shell','packaged-startup','installed-upgrade']]]) {
              check(r.schema === 1 && r.platform === platform && r.version === version && r.commit === commit && r.contract_sha256 === contractHash, 'Receipt identity mismatch: '+platform);
              for (const c of checks) check(r.checks.includes(c), 'Missing check: '+c);
            }
            check(mac.files.length === 1 && mac.files[0].name === 'DropDrive-v'+version+'.dmg', 'Invalid Mac receipt');
            const expected = new Map([[mac.files[0].name,mac.files[0].sha256]]);
            for (const f of win.files) {
              check(f.name === path.basename(f.name) && !f.name.includes('\\') && !expected.has(f.name), 'Unsafe/duplicate asset');
              check(hash(fs.readFileSync('prepared/'+f.name)) === f.sha256, 'Artifact checksum mismatch');
              expected.set(f.name,f.sha256);
            }
            const required = ['DropDrive-v'+version+'.dmg','com.dropdrive.windows-'+version+'-full.nupkg','com.dropdrive.windows-win-Setup.exe','com.dropdrive.windows-win-Portable.zip','releases.win.json','assets.win.json','RELEASES'];
            check(expected.size === required.length && required.every(n => expected.has(n)), 'Unexpected paired package: '+[...expected.keys()].join(', '));
            check(assets.every(a => expected.has(a.name) || a.name === 'mac-build.json'), 'Unexpected draft asset');
            const dmg = assets.find(a => a.name === mac.files[0].name);
            check(dmg && dmg.state === 'uploaded' && dmg.digest === 'sha256:'+mac.files[0].sha256, 'Uploaded Mac DMG hash mismatch');
            const feed = JSON.parse(fs.readFileSync('prepared/releases.win.json','utf8'));
            check(feed.Assets.length > 0, 'Empty feed');
            for (const a of feed.Assets) {
              check(a.Version === version && a.PackageId === 'com.dropdrive.windows' && a.Type === 'Full' && expected.has(a.FileName), 'Invalid feed');
              const data = fs.readFileSync('prepared/'+a.FileName);
              check(data.length === a.Size && crypto.createHash('sha1').update(data).digest('hex') === a.SHA1.toLowerCase(), 'Feed size/SHA1 mismatch');
              if (a.SHA256) check(hash(data) === a.SHA256.toLowerCase(), 'Feed SHA256 mismatch');
            }
            const notes = fs.readFileSync('packaging/release-notes-6.25.5.md','utf8') + '\n\nSource: '+commit+'\nsha256: '+mac.files[0].sha256+'\n\n## Windows live provider probes (UNAVAILABLE is not a pass)\n\n```text\n'+fs.readFileSync('provider/provider-checks.txt','utf8').trim()+'\n```\n';
            for (const f of win.files) {
              const present = assets.find(a => a.name === f.name);
              if (present) { check(present.digest === 'sha256:'+f.sha256, 'Existing asset differs'); continue; }
              const data = fs.readFileSync('prepared/'+f.name);
              await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:release.id,name:f.name,data,headers:{'content-type':'application/octet-stream','content-length':data.length}});
            }
            assets = await github.paginate(github.rest.repos.listReleaseAssets,{owner,repo,release_id:release.id,per_page:100});
            check(assets.length === expected.size+1 && assets.every(a => a.name === 'mac-build.json' || (a.state === 'uploaded' && a.digest === 'sha256:'+expected.get(a.name))), 'Remote paired asset set/hash mismatch');
            // Retain the build receipt for audit. Both platform packages become
            // discoverable together only after every remote hash is verified.
            await github.rest.repos.updateRelease({owner,repo,release_id:release.id,draft:false,make_latest:'true',body:notes});
            core.info('PASS same-source Mac + Windows maintenance release published; provider limitations disclosed');
  publish-windows-hotfix:
    needs: build
    if: ${{ inputs.publish_windows_hotfix == true && inputs.version == '6.25.3' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DropDrive-Windows-6.25.3
          path: prepared
      - uses: actions/download-artifact@v4
        with:
          name: DropDrive-Provider-Checks-6.25.3
          path: provider
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto'), path = require('path');
            const owner = context.repo.owner, repo = context.repo.repo, commit = context.sha;
            const version = '6.25.3', tag = 'windows-v'+version;
            const check = (ok, why) => { if (!ok) throw new Error(why); };
            const hash = data => crypto.createHash('sha256').update(data).digest('hex');
            const receipt = JSON.parse(fs.readFileSync('prepared/windows-build.json','utf8'));
            check(receipt.platform === 'windows' && receipt.version === version && receipt.commit === commit &&
              receipt.contract_sha256 === hash(fs.readFileSync('packaging/parity-contract.json')), 'Receipt mismatch');
            for (const name of ['core-ui','native-shell','packaged-startup','installed-upgrade'])
              check(receipt.checks.includes(name), 'Missing check: '+name);
            const expected = new Map();
            for (const f of receipt.files) {
              check(f.name === path.basename(f.name) && !f.name.endsWith('.dmg') && !expected.has(f.name), 'Unsafe filename/platform');
              check(hash(fs.readFileSync('prepared/'+f.name)) === f.sha256, 'Artifact hash mismatch');
              expected.set(f.name, f.sha256);
            }
            for (const name of ['com.dropdrive.windows-6.25.3-full.nupkg','com.dropdrive.windows-win-Setup.exe','com.dropdrive.windows-win-Portable.zip','releases.win.json','RELEASES'])
              check(expected.has(name), 'Missing package: '+name);
            const feed = JSON.parse(fs.readFileSync('prepared/releases.win.json','utf8'));
            check(feed.Assets.length > 0, 'Empty feed');
            for (const a of feed.Assets) {
              check(a.Version === version && a.PackageId === 'com.dropdrive.windows' && a.Type === 'Full' && expected.has(a.FileName), 'Invalid feed');
              const data = fs.readFileSync('prepared/'+a.FileName);
              check(data.length === a.Size && crypto.createHash('sha1').update(data).digest('hex') === a.SHA1.toLowerCase(), 'Feed hash mismatch');
            }
            const notes = fs.readFileSync('packaging/release-notes-windows-6.25.3.md','utf8') +
              '\n\nSource: '+commit+'\n\n## Live provider checks (not all providers necessarily pass)\n\n'+fs.readFileSync('provider/provider-checks.txt','utf8');
            const releases = await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            let release = releases.find(r => r.tag_name === tag);
            if (!release) release = (await github.rest.repos.createRelease({owner,repo,tag_name:tag,target_commitish:commit,draft:true,name:'DropDrive 6.25.3 · Windows',body:notes})).data;
            check(release.draft && !release.prerelease && release.target_commitish === commit && release.body === notes, 'Expected pinned draft');
            let assets = await github.paginate(github.rest.repos.listReleaseAssets,{owner,repo,release_id:release.id,per_page:100});
            for (const f of receipt.files) {
              const present = assets.find(a => a.name === f.name);
              if (present) { check(present.digest === 'sha256:'+f.sha256, 'Existing asset mismatch'); continue; }
              const data = fs.readFileSync('prepared/'+f.name);
              await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:release.id,name:f.name,data,
                headers:{'content-type':'application/octet-stream','content-length':data.length}});
            }
            assets = await github.paginate(github.rest.repos.listReleaseAssets,{owner,repo,release_id:release.id,per_page:100});
            check(assets.length === expected.size && assets.every(a => a.digest === 'sha256:'+expected.get(a.name)), 'Remote asset set/hash mismatch');
            await github.rest.repos.updateRelease({owner,repo,release_id:release.id,draft:false,make_latest:'false'});
            core.info('PASS verified Windows-only hotfix published; Mac release unchanged');
