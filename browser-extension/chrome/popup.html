<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropDrive</title>
    <style>
        body {
            width: 300px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f9fafb;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 8px 0;
            color: #1f2937;
        }
        p {
            font-size: 13px;
            margin: 0;
            color: #6b7280;
            line-height: 1.5;
        }
        .info {
            background: #e0e7ff;
            border: 1px solid #c7d2fe;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            font-size: 12px;
            color: #3730a3;
        }
        a {
            color: #3b82f6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>DropDrive</h1>
    <p>Download Google Drive files directly to your Mac.</p>
    
    <div class="info">
        <strong>How to use:</strong>
        <ol style="margin: 8px 0; padding-left: 20px;">
            <li>Visit Google Drive</li>
            <li>Right-click a file or folder</li>
            <li>Select "Send to DropDrive"</li>
            <li>Download starts automatically!</li>
        </ol>
    </div>
</body>
</html>
