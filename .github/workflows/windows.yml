name: Windows build (paired release preparation)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer for the Windows installer
        required: true
        default: 6.25.2
      verify_published_update:
        description: Test the published update only; do not rebuild or publish
        type: boolean
        default: false
      publish_prepared_6252:
        description: Publish the owner-approved, already-tested 6.25.2 pair
        type: boolean
        default: false
  push:
    tags:
      - windows-v*

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.verify_published_update != true && inputs.publish_prepared_6252 != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (!$version) { $version = $env:SOURCE_REF -replace '^windows-v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid stable version' }
          "DROPDRIVE_WINDOWS_VERSION=$version" >> $env:GITHUB_ENV
          $sourceHash = git rev-parse HEAD:packaging/parity-contract.json
          $workingHash = git hash-object --no-filters packaging/parity-contract.json
          if ($LASTEXITCODE -ne 0 -or $sourceHash -ne $workingHash) {
            throw 'Shared release contract bytes changed during checkout.'
          }
          Write-Host "Shared contract SHA256: $((Get-FileHash packaging/parity-contract.json -Algorithm SHA256).Hash.ToLowerInvariant())"
      - name: Fetch Windows media tools
        shell: pwsh
        run: ./windows/fetch-tools.ps1
      - name: Configure Windows desktop OAuth client
        shell: pwsh
        env:
          GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
        run: |
          if ($env:GOOGLE_DESKTOP_OAUTH_JSON) {
            $config = $env:GOOGLE_DESKTOP_OAUTH_JSON | ConvertFrom-Json
            if (!$config.installed.client_id -or !$config.installed.client_secret) { throw "Expected an installed/Desktop OAuth client." }
            [IO.File]::WriteAllText((Join-Path $PWD 'windows/DropDrive.Windows/oauth-client.json'), $env:GOOGLE_DESKTOP_OAUTH_JSON)
          } else {
            throw "Paired artifact blocked: configure GOOGLE_DESKTOP_OAUTH_JSON for optional Google login."
          }
      - name: Run Windows core checks
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -p:TreatWarningsAsErrors=true
      - name: Upload Windows UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Windows-UI-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/ui-checks/*.png
          if-no-files-found: error
      - name: Check native Windows notifications and integration
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -- --windows-shell
      - name: Probe public media providers without accounts
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -- --live-providers
      - name: Save live provider results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Provider-Checks-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/provider-checks.txt
      - name: Build EXE and installer
        shell: pwsh
        run: ./windows/build-windows.ps1 -Version $env:DROPDRIVE_WINDOWS_VERSION
      - name: Smoke-test installed app payload
        shell: pwsh
        run: |
          $process = Start-Process ./windows/artifacts/publish/DropDrive.exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "DropDrive exited during startup." }
            $process.Refresh()
            if ($process.MainWindowTitle -ne "DropDrive") {
              throw "DropDrive did not create its main window."
            }
            if (!(Test-Path ./windows/artifacts/releases/releases.win.json)) {
              throw "Windows update feed is missing."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Test installed upgrade and state retention
        shell: pwsh
        run: ./windows/test-install.ps1
      - name: Record tested artifact identity for paired release
        shell: pwsh
        run: |
          $files = @(Get-ChildItem windows/artifacts/releases -File | ForEach-Object {
            @{ name = $_.Name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          @{ schema = 1; platform = 'windows'; version = $env:DROPDRIVE_WINDOWS_VERSION;
             commit = '${{ github.sha }}'; contract_sha256 = (Get-FileHash packaging/parity-contract.json -Algorithm SHA256).Hash.ToLowerInvariant();
             checks = @('core-ui', 'native-shell', 'packaged-startup', 'installed-upgrade'); files = $files
          } | ConvertTo-Json -Depth 6 | Set-Content windows/artifacts/releases/windows-build.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Windows-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/releases/*
      # No publish permission or standalone upload: scripts/paired-release.rb
      # exposes these assets together with the signed Mac package.
  verify-published-update:
    if: ${{ inputs.verify_published_update == true }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: ["0.6.0", "6.25.0", "6.25.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Verify real public feed upgrade and retained state
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          SOURCE_VERSION: ${{ matrix.source }}
        run: |
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          ./windows/test-auto-update.ps1 -ExpectedVersion $env:EXPECTED_VERSION -SourceVersion $env:SOURCE_VERSION
  publish-prepared-6252:
    if: ${{ inputs.publish_prepared_6252 == true && inputs.verify_published_update != true && inputs.version == '6.25.2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DropDrive-Windows-6.25.2
          run-id: 36935419108
          github-token: ${{ github.token }}
          path: prepared
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const owner = context.repo.owner, repo = context.repo.repo;
            const commit = '691630576659fba500207e8441f440cdcfa143e2';
            const macName = 'DropDrive-v6.25.2.dmg';
            const macHash = '33d824fc8b1696b5ae8fac1a799cde4bf0970132649d7ae5fa5d3687328dfab6';
            const check = (ok, why) => { if (!ok) throw new Error(why); };
            const run = (await github.rest.actions.getWorkflowRun({owner,repo,run_id:36935419108})).data;
            check(run.conclusion === 'success' && run.head_sha === commit, 'Source build mismatch');
            const receipt = JSON.parse(fs.readFileSync('prepared/windows-build.json','utf8'));
            check(receipt.platform === 'windows' && receipt.version === '6.25.2' && receipt.commit === commit &&
              receipt.contract_sha256 === '8f3c2d0f51a5f1785ba75cf0e1901750bc592483a38a2665b379bd8db17da8f8', 'Receipt mismatch');
            for (const name of ['core-ui','native-shell','packaged-startup','installed-upgrade'])
              check(receipt.checks.includes(name), 'Missing check: '+name);
            const expected = new Map([[macName, macHash]]);
            for (const f of receipt.files) {
              check(f.name === require('path').basename(f.name) && !expected.has(f.name), 'Unsafe filename');
              const data = fs.readFileSync('prepared/'+f.name);
              check(crypto.createHash('sha256').update(data).digest('hex') === f.sha256, 'Local hash mismatch');
              expected.set(f.name, f.sha256);
            }
            for (const name of ['com.dropdrive.windows-6.25.2-full.nupkg','com.dropdrive.windows-win-Setup.exe','com.dropdrive.windows-win-Portable.zip','releases.win.json','RELEASES'])
              check(expected.has(name), 'Missing package: '+name);
            const feed = JSON.parse(fs.readFileSync('prepared/releases.win.json','utf8'));
            check(feed.Assets.length > 0, 'Empty feed');
            for (const a of feed.Assets) {
              check(a.Version === '6.25.2' && a.PackageId === 'com.dropdrive.windows' && a.Type === 'Full' && expected.has(a.FileName), 'Invalid feed');
              const data = fs.readFileSync('prepared/'+a.FileName);
              check(data.length === a.Size && crypto.createHash('sha1').update(data).digest('hex') === a.SHA1.toLowerCase(), 'Feed hash mismatch');
            }
            const releases = await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            const release = releases.find(r => r.tag_name === 'v6.25.2');
            check(release && release.draft && !release.prerelease && release.target_commitish === commit, 'Expected pinned draft');
            check(release.body.includes('sha256: '+macHash) && release.body.includes('TikTok') && release.body.includes(commit), 'Incomplete release notes');
            let assets = await github.paginate(github.rest.repos.listReleaseAssets,{owner,repo,release_id:release.id,per_page:100});
            check(assets.some(a => a.name === macName && a.digest === 'sha256:'+macHash), 'Signed Mac artifact missing');
            for (const f of receipt.files) {
              const present = assets.find(a => a.name === f.name);
              if (present) { check(present.digest === 'sha256:'+f.sha256, 'Existing asset mismatch'); continue; }
              const data = fs.readFileSync('prepared/'+f.name);
              await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:release.id,name:f.name,data,
                headers:{'content-type':'application/octet-stream','content-length':data.length}});
            }
            assets = await github.paginate(github.rest.repos.listReleaseAssets,{owner,repo,release_id:release.id,per_page:100});
            check(assets.length === expected.size && assets.every(a => a.digest === 'sha256:'+expected.get(a.name)), 'Remote asset set/hash mismatch');
            await github.rest.repos.updateRelease({owner,repo,release_id:release.id,draft:false,make_latest:'true'});
            core.info('PASS verified same-source paired release, feed and all remote SHA256 digests; published v6.25.2');
