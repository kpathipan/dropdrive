name: Windows build (paired release preparation)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer for the Windows installer
        required: true
        default: 6.25.1
  push:
    tags:
      - windows-v*

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (!$version) { $version = $env:SOURCE_REF -replace '^windows-v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid stable version' }
          "DROPDRIVE_WINDOWS_VERSION=$version" >> $env:GITHUB_ENV
          $sourceHash = git rev-parse HEAD:packaging/parity-contract.json
          $workingHash = git hash-object --no-filters packaging/parity-contract.json
          if ($LASTEXITCODE -ne 0 -or $sourceHash -ne $workingHash) {
            throw 'Shared release contract bytes changed during checkout.'
          }
          Write-Host "Shared contract SHA256: $((Get-FileHash packaging/parity-contract.json -Algorithm SHA256).Hash.ToLowerInvariant())"
      - name: Fetch Windows media tools
        shell: pwsh
        run: ./windows/fetch-tools.ps1
      - name: Configure Windows desktop OAuth client
        shell: pwsh
        env:
          GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
        run: |
          if ($env:GOOGLE_DESKTOP_OAUTH_JSON) {
            $config = $env:GOOGLE_DESKTOP_OAUTH_JSON | ConvertFrom-Json
            if (!$config.installed.client_id -or !$config.installed.client_secret) { throw "Expected an installed/Desktop OAuth client." }
            [IO.File]::WriteAllText((Join-Path $PWD 'windows/DropDrive.Windows/oauth-client.json'), $env:GOOGLE_DESKTOP_OAUTH_JSON)
          } else {
            throw "Paired artifact blocked: configure GOOGLE_DESKTOP_OAUTH_JSON for optional Google login."
          }
      - name: Run Windows core checks
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -p:TreatWarningsAsErrors=true
      - name: Upload Windows UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Windows-UI-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/ui-checks/*.png
          if-no-files-found: error
      - name: Check native Windows notifications and integration
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -- --windows-shell
      - name: Probe public media providers without accounts
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release -- --live-providers
      - name: Save live provider results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Provider-Checks-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/provider-checks.txt
      - name: Build EXE and installer
        shell: pwsh
        run: ./windows/build-windows.ps1 -Version $env:DROPDRIVE_WINDOWS_VERSION
      - name: Smoke-test installed app payload
        shell: pwsh
        run: |
          $process = Start-Process ./windows/artifacts/publish/DropDrive.exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "DropDrive exited during startup." }
            $process.Refresh()
            if ($process.MainWindowTitle -ne "DropDrive") {
              throw "DropDrive did not create its main window."
            }
            if (!(Test-Path ./windows/artifacts/releases/releases.win.json)) {
              throw "Windows update feed is missing."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Test installed upgrade and state retention
        shell: pwsh
        run: ./windows/test-install.ps1
      - name: Record tested artifact identity for paired release
        shell: pwsh
        run: |
          $files = @(Get-ChildItem windows/artifacts/releases -File | ForEach-Object {
            @{ name = $_.Name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          @{ schema = 1; platform = 'windows'; version = $env:DROPDRIVE_WINDOWS_VERSION;
             commit = '${{ github.sha }}'; contract_sha256 = (Get-FileHash packaging/parity-contract.json -Algorithm SHA256).Hash.ToLowerInvariant();
             checks = @('core-ui', 'native-shell', 'packaged-startup', 'installed-upgrade'); files = $files
          } | ConvertTo-Json -Depth 6 | Set-Content windows/artifacts/releases/windows-build.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Windows-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/releases/*
      # No publish permission or standalone upload: scripts/paired-release.rb
      # exposes these assets together with the signed Mac package.
