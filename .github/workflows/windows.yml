name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer for the Windows installer
        required: true
        default: 0.2.0
  push:
    tags:
      - windows-v*

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (!$version) { $version = "${{ github.ref_name }}" -replace '^windows-v', '' }
          "DROPDRIVE_WINDOWS_VERSION=$version" >> $env:GITHUB_ENV
      - name: Fetch Windows media tools
        shell: pwsh
        run: ./windows/fetch-tools.ps1
      - name: Run Windows core checks
        run: dotnet run --project windows/DropDrive.Windows.Checks/DropDrive.Windows.Checks.csproj -c Release
      - name: Build EXE and installer
        shell: pwsh
        run: ./windows/build-windows.ps1 -Version $env:DROPDRIVE_WINDOWS_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: DropDrive-Windows-${{ env.DROPDRIVE_WINDOWS_VERSION }}
          path: windows/artifacts/releases/*
      - name: Publish Windows update feed
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          cd windows && dotnet tool run vpk upload github
          --outputDir artifacts/releases
          --repoUrl https://github.com/kpathipan/dropdrive
          --token $env:GITHUB_TOKEN
          --publish true
          --tag ${{ github.ref_name }}
